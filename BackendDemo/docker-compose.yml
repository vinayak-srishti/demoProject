services:
  # --- Backend Service (Node.js/Express) ---
  gdd_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gdd_backend_prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Uses the .env file created by the deployment script
    env_file: .env 
    # Ensure backend waits for the database to be reported as healthy
    depends_on:
      gdd_mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - gdd_network

  # --- Database Service (MongoDB) ---
  gdd_mongo:
    image: mongo:latest
    container_name: gdd_mongo_prod
    restart: unless-stopped
    ports:
      # Expose internal Mongo port 27017 to host port 27018 (avoids conflict).
      # Backend connects internally using 'gdd_mongo:27017'.
      - "27018:27017" 
    volumes:
      # Persistent storage for MongoDB data
      - mongo_data:/data/db
    healthcheck:
      # Uses mongosh for a more robust, official MongoDB health check
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - gdd_network

# --- Volume Definitions ---
volumes:
  mongo_data:
    # Volume to persist MongoDB data

# --- Network Definition ---
networks:
  gdd_network:
    driver: bridge
    name: current_gdd_network
